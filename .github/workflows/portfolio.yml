name: Portfolio
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: true
jobs:
  portfolio:
    if: github.repository == 'alonsoquezadar/Encode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run verify:portfolio --prefix frontend
      - run: npm run build:portfolio --prefix frontend
      - name: Publish to Cloudflare Pages
        if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d2eee8fabbc3fcad9ce5252a24d71b91
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret before enabling deployment.'
            exit 1
          fi
          npx --yes wrangler@4.153.0 pages deploy frontend/dist --project-name andes --branch main
      - name: Explain disabled publishing
        if: vars.CLOUDFLARE_DEPLOY_ENABLED != 'true'
        run: echo 'Build and replay verification completed. Publishing is disabled until CLOUDFLARE_API_TOKEN and CLOUDFLARE_DEPLOY_ENABLED are configured. The existing public site is unchanged.' >> "$GITHUB_STEP_SUMMARY"
